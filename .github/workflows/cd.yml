name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application
        run: |
          tar -czf app.tar.gz strings.js package.json package-lock.json

      - name: Upload artifact to S3
        run: |
          aws s3 cp app.tar.gz s3://${{ secrets.S3_BUCKET }}/deployments/app-${{ github.sha }}.tar.gz

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands=[
              "cd /home/ubuntu",
              "aws s3 cp s3://${{ secrets.S3_BUCKET }}/deployments/app-${{ github.sha }}.tar.gz app.tar.gz",
              "tar -xzf app.tar.gz",
              "npm install --production",
              "pm2 restart app || pm2 start strings.js --name app",
              "pm2 save"
            ] \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify deployment
        run: |
          echo "Deployment of commit ${{ github.sha }} completed successfully"
          echo "Instance: ${{ secrets.EC2_INSTANCE_ID }}"
          echo "Artifact: s3://${{ secrets.S3_BUCKET }}/deployments/app-${{ github.sha }}.tar.gz"
